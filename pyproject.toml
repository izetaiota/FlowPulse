[project]
name = "douyin-transcribe-api"
version = "0.1.0"
description = "心流 FlowPulse — 自媒体全域运营工作台（抖音转写 / 小红书抓取 / 公众号订阅 RSS）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aliyun-python-sdk-core>=2.13.12",
  "beautifulsoup4>=4.12.3",
  "fastapi>=0.115.0",
  "httpx>=0.27.2",
  "oss2>=2.19.1",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.12",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
sensevoice = [
  "funasr>=1.1.12",
  "modelscope>=1.20.0",
  "torch>=2.4.0",
  "torchaudio>=2.4.0",
]
whisper = [
  "faster-whisper>=1.1.0",
]
xhs = [
  "curl_cffi==0.15.0",
  "PyExecJS>=1.5.1",
  "loguru>=0.7.2",
  "retry>=0.9.2",
  "openpyxl>=3.1.5",
  "qrcode>=7.4.2",
  "pillow>=10.4.0",
  "opencv-python>=4.10.0.84",
  "numpy>=1.26.4",
]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "respx>=0.21.1",
  "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metacorpus", "src/douyin", "src/xhs_spider", "src/weread"]

[tool.hatch.build.targets.wheel.force-include]
"src/xhs_spider/xhs_utils/xhs_core/js" = "xhs_spider/xhs_utils/xhs_core/js"
"src/xhs_spider/xhs_utils/xhs_pc/js" = "xhs_spider/xhs_utils/xhs_pc/js"
"src/xhs_spider/xhs_utils/xhs_creator/js" = "xhs_spider/xhs_utils/xhs_creator/js"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
