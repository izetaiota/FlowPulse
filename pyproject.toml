[project]
name = "douyin-transcribe-api"
version = "0.1.0"
description = "FastAPI service for resolving and transcribing Douyin videos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aliyun-python-sdk-core>=2.13.12",
  "beautifulsoup4>=4.12.3",
  "fastapi>=0.115.0",
  "httpx>=0.27.2",
  "oss2>=2.19.1",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.12",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
sensevoice = [
  "funasr>=1.1.12",
  "modelscope>=1.20.0",
  "torch>=2.4.0",
  "torchaudio>=2.4.0",
]
whisper = [
  "faster-whisper>=1.1.0",
]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "respx>=0.21.1",
  "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/douyin_transcribe"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
